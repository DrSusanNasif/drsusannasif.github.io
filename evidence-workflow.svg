<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
<title id="title">From biological questions to useful evidence</title>
<desc id="desc">Biological questions and research data inform reproducible workflows. Evidence interpretation connects these workflows to scientific strategy and clear communication.</desc>
